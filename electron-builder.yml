# Last Modified: 2026-09-11
#
# Minimal packaging config so `npm run build` produces something
# installable. No code signing configured yet — add per-OS signing
# (Authenticode / Developer ID + notarization) before distributing builds.

appId: com.joshuahkirby.northstar
productName: Northstar
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - node_modules/node-pty/**/*
# node-pty's prebuilt .node binaries can't be loaded from inside the asar
# archive (native `dlopen` needs a real file on disk), so keep it unpacked.
asarUnpack:
  - node_modules/node-pty/**/*
# The license requires every copy to carry its terms, and the bundled
# dependencies' licenses require their notices too - so all three ship next
# to the executable, beside electron-builder's own LICENSE.electron.txt.
extraFiles:
  - LICENSE
  - PRIVACY.md
  - THIRD_PARTY_NOTICES.txt
win:
  target: nsis
mac:
  target: dmg
  category: public.app-category.utilities
linux:
  target: AppImage
  category: Network
